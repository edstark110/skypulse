<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATLAS — Find the right flight</title>
<meta name="description" content="Compare prices, durations, and journey quality across airlines. One search, every option, ranked clearly." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ATLAS · minimal flight comparison
     Single-file vanilla. No fakes. Search → compare → save → book.
     ============================================================ */

  :root {
    --bg:        #F4F2EC;
    --paper:     #FFFFFF;
    --ink:       #1A1814;
    --ink-2:     #4A4640;
    --ink-3:     #8A857C;
    --accent:    #B8956A;
    --accent-2:  #8A6C45;
    --line:      rgba(26, 24, 20, 0.08);
    --line-2:    rgba(26, 24, 20, 0.16);
    --good:      #2F7D4F;
    --warn:      #B8703A;
    --bad:       #A4413E;
    --shadow-1:  0 1px 2px rgba(26,24,20,0.04), 0 0 0 1px rgba(26,24,20,0.04);
    --shadow-2:  0 4px 16px rgba(26,24,20,0.06), 0 0 0 1px rgba(26,24,20,0.05);
    --radius:    10px;
    --radius-sm: 6px;
    --serif:     'Fraunces', Georgia, serif;
    --sans:      'Source Sans 3', system-ui, -apple-system, sans-serif;
    --mono:      'JetBrains Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: inherit; }

  /* ===== Layout ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ===== Header ===== */
  header.site {
    position: sticky; top: 0; z-index: 50;
    background: rgba(244, 242, 236, 0.86);
    backdrop-filter: saturate(140%) blur(12px);
    -webkit-backdrop-filter: saturate(140%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .brand {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .brand-mark {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
    transform: translateY(-2px);
  }
  .nav-links {
    display: flex; gap: 28px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .nav-links a {
    padding: 6px 0;
    border-bottom: 1px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  /* ===== Hero ===== */
  .hero {
    padding: 72px 0 32px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 20px;
  }
  .headline {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(40px, 7vw, 84px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--ink);
    max-width: 14ch;
    margin-bottom: 20px;
  }
  .headline em {
    font-style: italic;
    color: var(--accent-2);
  }
  .lede {
    max-width: 56ch;
    font-size: 18px;
    line-height: 1.55;
    color: var(--ink-2);
    margin-bottom: 40px;
  }

  /* ===== Search card ===== */
  .search-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-2);
  }
  .trip-type {
    display: flex; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px;
    border-radius: 999px;
    width: fit-content;
    margin-bottom: 16px;
  }
  .trip-type button {
    padding: 6px 16px;
    font-size: 13px;
    color: var(--ink-2);
    border-radius: 999px;
    transition: all .15s ease;
  }
  .trip-type button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .search-row {
    display: grid;
    grid-template-columns: 1.4fr 1.4fr 1fr 1fr 0.8fr 0.8fr auto;
    gap: 8px;
    align-items: stretch;
  }
  .search-row.one-way {
    grid-template-columns: 1.4fr 1.4fr 1fr 0.8fr 0.8fr auto;
  }
  .field {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.12);
  }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .field input,
  .field select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: var(--ink);
    padding: 0;
  }
  .field-hint {
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 2px;
    height: 14px;
    overflow: hidden;
  }

  .ac {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-2);
    z-index: 20;
    max-height: 280px;
    overflow-y: auto;
  }
  .ac-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: var(--bg); }
  .ac-iata {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent-2);
    font-weight: 500;
    min-width: 32px;
  }
  .ac-city { color: var(--ink); font-size: 14px; }
  .ac-country { color: var(--ink-3); font-size: 12px; margin-left: auto; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    transition: all .15s ease;
    background: var(--ink);
    color: var(--bg);
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-2); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    padding: 14px 22px;
    font-size: 15px;
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink-2);
    border: 1px solid var(--line);
  }
  .btn-ghost:hover { background: var(--paper); color: var(--ink); border-color: var(--line-2); }
  .btn-search {
    align-self: stretch;
    background: var(--accent);
    color: var(--paper);
    padding: 0 24px;
    font-weight: 600;
  }
  .btn-search:hover { background: var(--accent-2); }

  /* ===== Principles (homepage) ===== */
  .principles {
    padding: 64px 0 96px;
    border-top: 1px solid var(--line);
    margin-top: 64px;
  }
  .principles-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin-bottom: 32px;
  }
  .principle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }
  .principle {
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .principle .num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.12em;
    margin-bottom: 12px;
  }
  .principle h3 {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .principle p {
    color: var(--ink-2);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ===== Results page ===== */
  .results-bar {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    position: sticky;
    top: 64px;
    z-index: 40;
  }
  .results-bar-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .summary {
    display: flex; align-items: baseline; gap: 14px;
    font-size: 14px;
    color: var(--ink-2);
  }
  .summary .route {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .summary .meta { font-size: 13px; color: var(--ink-3); }

  .sort-tabs {
    display: flex; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    padding: 3px;
    border-radius: 999px;
  }
  .sort-tabs button {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--ink-2);
    border-radius: 999px;
    transition: all .15s ease;
  }
  .sort-tabs button.active {
    background: var(--paper);
    color: var(--ink);
    box-shadow: var(--shadow-1);
  }

  .results-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 32px;
    padding: 24px 0 96px;
  }
  .filter-rail {
    position: sticky;
    top: 130px;
    align-self: start;
    max-height: calc(100vh - 150px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .filter-block {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  .filter-block:last-child { border-bottom: none; }
  .filter-block h4 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .filter-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    transition: color .15s ease;
  }
  .filter-row:hover { color: var(--ink); }
  .filter-row input {
    margin-right: 8px;
    accent-color: var(--accent);
  }
  .filter-row .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
  }
  .range-input {
    width: 100%;
    accent-color: var(--accent);
    margin-top: 4px;
  }
  .range-value {
    display: flex; justify-content: space-between;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 6px;
  }

  /* ===== Result cards ===== */
  .results-list { display: flex; flex-direction: column; gap: 12px; }
  .result {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 24px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .result:hover {
    border-color: var(--line-2);
    box-shadow: var(--shadow-2);
  }
  .result-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 24px;
    align-items: center;
  }
  .leg {
    display: flex; align-items: center; gap: 20px;
  }
  .leg + .leg {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .airline {
    min-width: 70px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .airline-name {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 2px;
  }
  .times {
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .times .arrow {
    color: var(--ink-3);
    font-size: 18px;
  }
  .times .iata {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .leg-meta {
    font-size: 13px;
    color: var(--ink-3);
    display: flex; gap: 14px;
    margin-top: 4px;
  }
  .leg-meta .stops { color: var(--ink-2); }
  .leg-meta .stops.nonstop { color: var(--good); }
  .leg-meta .stops.stops-1 { color: var(--ink-2); }
  .leg-meta .stops.stops-2 { color: var(--warn); }

  .price-block {
    text-align: right;
    min-width: 110px;
  }
  .price {
    font-family: var(--serif);
    font-size: 28px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .price-meta {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
  }

  .result-actions {
    display: flex; flex-direction: column; gap: 6px;
    align-items: stretch;
    min-width: 140px;
  }
  .quality-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-family: var(--mono);
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-2);
    width: fit-content;
    margin-bottom: 8px;
  }
  .quality-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--good);
  }
  .quality-dot.fair { background: var(--warn); }
  .quality-dot.poor { background: var(--bad); }

  /* Result detail expansion */
  .result-detail {
    display: none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .result.open .result-detail { display: block; }
  .segments {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 18px;
  }
  .segment {
    display: grid;
    grid-template-columns: 80px 1fr auto;
    gap: 16px;
    padding: 10px 0;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .segment:last-of-type { border-bottom: none; }
  .seg-flight {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-2);
  }
  .seg-flight .num { color: var(--ink-3); display: block; font-size: 11px; margin-top: 2px; }
  .seg-route {
    font-size: 14px;
    color: var(--ink);
  }
  .seg-route .small { color: var(--ink-3); font-size: 12px; }
  .seg-dur {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
  }
  .layover {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--warn);
    padding: 6px 10px;
    background: rgba(184, 112, 58, 0.06);
    border-radius: var(--radius-sm);
    text-align: center;
  }

  .quality-breakdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 14px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    margin-bottom: 18px;
  }
  .qb-item {
    text-align: center;
    border-right: 1px solid var(--line);
    padding-right: 12px;
  }
  .qb-item:last-child { border-right: none; padding-right: 0; }
  .qb-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
  .qb-value {
    font-family: var(--serif);
    font-size: 18px;
    color: var(--ink);
    font-weight: 500;
  }

  .detail-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }

  /* ===== Empty / state ===== */
  .empty {
    padding: 64px 32px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty .em-title {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink-2);
    margin-bottom: 6px;
  }
  .empty .em-sub { font-size: 14px; }

  /* ===== Trips view ===== */
  .trips {
    padding: 56px 0 96px;
  }
  .trips h1 {
    font-family: var(--serif);
    font-size: 44px;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 32px;
    color: var(--ink);
  }
  .trip-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 22px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: center;
    margin-bottom: 10px;
  }
  .trip-card .route {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .trip-card .meta { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  .trip-card .actions { display: flex; gap: 8px; }

  /* ===== Footer ===== */
  footer.site {
    border-top: 1px solid var(--line);
    padding: 28px 0 56px;
    color: var(--ink-3);
    font-size: 13px;
  }
  footer.site p + p { margin-top: 6px; font-style: italic; font-family: var(--serif); color: var(--ink-3); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: all .25s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .principle-grid { grid-template-columns: 1fr; gap: 16px; }
    .results-layout { grid-template-columns: 1fr; }
    .filter-rail { position: static; max-height: none; }
    .search-row,
    .search-row.one-way {
      grid-template-columns: 1fr 1fr;
    }
    .search-row .btn-search {
      grid-column: 1 / -1;
      padding: 14px;
    }
    .result-row {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .price-block { text-align: left; }
    .result-actions { flex-direction: row; }
    .quality-breakdown { grid-template-columns: repeat(2, 1fr); }
    .qb-item { border-right: none; padding-right: 0; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a href="#/" class="brand"><span class="brand-mark"></span>ATLAS</a>
    <nav class="nav-links">
      <a href="#/" data-route="home">Flights</a>
      <a href="#/trips" data-route="trips">Trips</a>
    </nav>
  </div>
</header>

<main id="root"></main>

<footer class="site">
  <div class="wrap">
    <p>ATLAS · Flight intelligence</p>
    <p>Demo data for routing and pricing. Booking links open Google Flights for live availability.</p>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ATLAS — minimal flight comparison
   ===================================================================== */

(() => {
'use strict';

/* ---------- Data: airports ---------- */
const AIRPORTS = [
  { iata: 'DXB', city: 'Dubai',         country: 'United Arab Emirates', lat: 25.253, lng: 55.365 },
  { iata: 'AUH', city: 'Abu Dhabi',     country: 'United Arab Emirates', lat: 24.433, lng: 54.651 },
  { iata: 'DOH', city: 'Doha',          country: 'Qatar',                lat: 25.273, lng: 51.608 },
  { iata: 'JED', city: 'Jeddah',        country: 'Saudi Arabia',         lat: 21.679, lng: 39.156 },
  { iata: 'RUH', city: 'Riyadh',        country: 'Saudi Arabia',         lat: 24.957, lng: 46.698 },
  { iata: 'LHR', city: 'London',        country: 'United Kingdom',       lat: 51.470, lng: -0.454 },
  { iata: 'LGW', city: 'London',        country: 'United Kingdom',       lat: 51.148, lng: -0.190 },
  { iata: 'CDG', city: 'Paris',         country: 'France',               lat: 49.009, lng: 2.547 },

/* ---------- Utilities ---------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function haversine(a, b) {
  const R = 6371;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// Deterministic seedable PRNG (mulberry32)
function rng(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
}

function fmtPrice(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtDuration(mins) {
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return `${h}h ${m.toString().padStart(2,'0')}m`;
}
function fmtTime(mins) {
  // mins from midnight
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const y = d.getFullYear();
  const m = (d.getMonth() + 1).toString().padStart(2, '0');
  const day = d.getDate().toString().padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- State ---------- */
const STATE = {
  query: null,        // { from, to, depart, ret, pax, cabin, tripType }
  results: [],
  sort: 'best',       // best | cheap | fast
  filters: {
    stops: new Set(['0','1','2']),
    airlines: new Set(),    // empty = all
    maxPrice: null,
    departWindow: 'any',    // any | morning | afternoon | evening | night
  },
  expandedId: null,
};

/* ---------- Result generation ---------- */
function generateResults(query) {
  const from = AIRPORT_BY_IATA[query.from];
  const to   = AIRPORT_BY_IATA[query.to];
  if (!from || !to) return [];

  const distKm = haversine(from, to);
  if (distKm < 50) return [];

  const seed = hashStr(`${query.from}-${query.to}-${query.depart}-${query.cabin}`);
  const rand = rng(seed);

  const cabinMult = { Economy: 1, 'Premium Economy': 1.6, Business: 3.6, First: 6.5 }[query.cabin] || 1;
  const baseDirectMins = Math.round(60 + distKm / 850 * 60);

  // Build a candidate set of airlines: prefer relevant hubs + a sample
  const candidates = [];
  const hubMatch = AIRLINES.filter(a => a.hub === from.iata || a.hub === to.iata);
  candidates.push(...hubMatch);
  // add a deterministic sample of others
  const others = AIRLINES.filter(a => !hubMatch.includes(a));
  for (let i = 0; i < others.length; i++) {
    if (rand() < 0.55) candidates.push(others[i]);
  }
  // Trim / minimum
  while (candidates.length < 5) candidates.push(AIRLINES[Math.floor(rand() * AIRLINES.length)]);

  const results = [];
  const numResults = 6 + Math.floor(rand() * 4); // 6-9

  for (let i = 0; i < numResults && i < candidates.length; i++) {
    const airline = candidates[i];

    // Stops decision: longer routes = more stop variety
    let stops;
    const stopRoll = rand();
    if (distKm < 1500) stops = 0;
    else if (distKm < 4000) stops = stopRoll < 0.55 ? 0 : 1;
    else if (distKm < 9000) stops = stopRoll < 0.30 ? 0 : (stopRoll < 0.85 ? 1 : 2);
    else stops = stopRoll < 0.18 ? 0 : (stopRoll < 0.78 ? 1 : 2);

    const stopOverhead = stops === 0 ? 0 : (stops === 1 ? 90 + Math.floor(rand() * 240) : 240 + Math.floor(rand() * 360));
    const totalMins = baseDirectMins + stopOverhead + Math.floor(rand() * 30);

    const depMins = Math.floor(rand() * 24 * 60);
    const arrMins = depMins + totalMins;

    // Price model
    let price = (distKm * 0.075 + 80) * airline.tier * cabinMult;
    price *= (1 + (rand() - 0.5) * 0.18);
    if (stops > 0) price *= (1 - 0.06 * stops); // stops cheaper
    price *= 1 + (query.pax - 1) * 0; // per-person displayed; total handled at booking
    price = Math.max(60, price);

    // Build segments
    const segments = [];
    if (stops === 0) {
      segments.push({
        airline: airline.code,
        flightNum: `${airline.code}${100 + Math.floor(rand() * 900)}`,
        from: from.iata,
        to: to.iata,
        depMins,
        arrMins,
        durMins: totalMins,
      });
    } else {
      // Pick stop airport: a major hub geographically between
      const candidateHubs = AIRPORTS.filter(a => a.iata !== from.iata && a.iata !== to.iata);
      candidateHubs.sort((a, b) => {
        const da = haversine(from, a) + haversine(a, to);
        const db = haversine(from, b) + haversine(b, to);
        return da - db;
      });
      const hubAirports = candidateHubs.slice(0, 6 + stops);
      const hubIdx = Math.floor(rand() * hubAirports.length);
      const hub1 = hubAirports[hubIdx];

      const leg1Min = Math.round(60 + haversine(from, hub1) / 850 * 60);
      const layover1 = 60 + Math.floor(rand() * 180);

      segments.push({
        airline: airline.code,
        flightNum: `${airline.code}${100 + Math.floor(rand() * 900)}`,
        from: from.iata,
        to: hub1.iata,
        depMins,
        arrMins: depMins + leg1Min,
        durMins: leg1Min,
      });

      if (stops === 1) {
        const leg2Min = Math.round(60 + haversine(hub1, to) / 850 * 60);
        segments.push({
          airline: airline.code,
          flightNum: `${airline.code}${100 + Math.floor(rand() * 900)}`,
          from: hub1.iata,
          to: to.iata,
          depMins: depMins + leg1Min + layover1,
          arrMins: depMins + leg1Min + layover1 + leg2Min,
          durMins: leg2Min,
        });
      } else {
        // 2 stops
        const hubIdx2 = (hubIdx + 1 + Math.floor(rand() * (hubAirports.length - 1))) % hubAirports.length;
        const hub2 = hubAirports[hubIdx2] || hubAirports[0];
        const leg2Min = Math.round(45 + haversine(hub1, hub2) / 850 * 60);
        const layover2 = 60 + Math.floor(rand() * 180);
        const leg3Min = Math.round(60 + haversine(hub2, to) / 850 * 60);
        segments.push({
          airline: airline.code,
          flightNum: `${airline.code}${100 + Math.floor(rand() * 900)}`,
          from: hub1.iata,
          to: hub2.iata,
          depMins: depMins + leg1Min + layover1,
          arrMins: depMins + leg1Min + layover1 + leg2Min,
          durMins: leg2Min,
        });
        segments.push({
          airline: airline.code,
          flightNum: `${airline.code}${100 + Math.floor(rand() * 900)}`,
          from: hub2.iata,
          to: to.iata,
          depMins: depMins + leg1Min + layover1 + leg2Min + layover2,
          arrMins: depMins + leg1Min + layover1 + leg2Min + layover2 + leg3Min,
          durMins: leg3Min,
        });
      }
    }

    // Quality score: 100 - penalties
    const directMins = baseDirectMins;
    const overheadPct = (totalMins - directMins) / directMins;
    let q = 100;
    q -= stops * 14;
    q -= Math.min(30, overheadPct * 80);
    if (depMins < 5*60 || depMins > 23*60) q -= 6; // very early / very late
    q = Math.max(20, Math.round(q));

    results.push({
      id: `r${i}_${seed.toString(36)}`,
      airline,
      stops,
      durMins: totalMins,
      depMins,
      arrMins,
      price: Math.round(price),
      quality: q,
      segments,
    });
  }

  return results;
}

/* ---------- Sorting & filtering ---------- */
function sortResults(list, mode) {
  const arr = [...list];
  if (mode === 'cheap') arr.sort((a,b) => a.price - b.price);
  else if (mode === 'fast') arr.sort((a,b) => a.durMins - b.durMins);
  else { // best: blended
    arr.sort((a,b) => {
      const sa = a.price * 0.5 + a.durMins * 0.3 - a.quality * 4;
      const sb = b.price * 0.5 + b.durMins * 0.3 - b.quality * 4;
      return sa - sb;
    });
  }
  return arr;
}
function applyFilters(list, f) {
  return list.filter(r => {
    if (!f.stops.has(String(r.stops))) return false;
    if (f.airlines.size && !f.airlines.has(r.airline.code)) return false;
    if (f.maxPrice != null && r.price > f.maxPrice) return false;
    if (f.departWindow !== 'any') {
      const h = Math.floor(r.depMins / 60) % 24;
      const win = f.departWindow;
      if (win === 'morning'   && !(h >= 5 && h < 12)) return false;
      if (win === 'afternoon' && !(h >= 12 && h < 17)) return false;
      if (win === 'evening'   && !(h >= 17 && h < 22)) return false;
      if (win === 'night'     && !(h >= 22 || h < 5)) return false;
    }
    return true;
  });
}

/* ---------- Saved trips (localStorage) ---------- */
const TRIPS_KEY = 'atlas:trips';
function loadTrips() {
  try { return JSON.parse(localStorage.getItem(TRIPS_KEY) || '[]'); }
  catch { return []; }
}
function saveTrips(arr) {
  localStorage.setItem(TRIPS_KEY, JSON.stringify(arr));
}
function saveResultAsTrip(r) {
  const trips = loadTrips();
  const id = `${STATE.query.from}-${STATE.query.to}-${STATE.query.depart}-${r.id}`;
  if (trips.some(t => t.id === id)) { toast('Already saved'); return; }
  trips.unshift({
    id,
    savedAt: Date.now(),
    query: { ...STATE.query },
    snapshot: {
      airlineCode: r.airline.code,
      airlineName: r.airline.name,
      price: r.price,
      durMins: r.durMins,
      stops: r.stops,
      depMins: r.depMins,
      arrMins: r.arrMins,
    },
  });
  saveTrips(trips.slice(0, 50));
  toast('Saved to Trips');
}
function deleteTrip(id) {
  saveTrips(loadTrips().filter(t => t.id !== id));
  render();
}

/* ---------- Routing ---------- */
function parseHash() {
  const raw = location.hash || '#/';
  const [path, qs] = raw.replace(/^#/, '').split('?');
  const params = new URLSearchParams(qs || '');
  return { path, params };
}
function navigate(path, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = path + qs;
}

/* ---------- Booking link (real) ---------- */
function bookingUrl(query) {
  // Google Flights deep link (real, working)
  const fmt = d => d ? d.replace(/-/g, '') : '';
  let url = 'https://www.google.com/travel/flights';
  const parts = [
    `Flights from ${query.from} to ${query.to}`,
    `on ${query.depart}`,
  ];
  if (query.tripType === 'round' && query.ret) parts.push(`returning ${query.ret}`);
  url += '?q=' + encodeURIComponent(parts.join(' '));
  return url;
}

function filterRail() {
  const f = STATE.filters;
  const counts = {
    stops: { '0': 0, '1': 0, '2': 0 },
    airlines: {},
  };
  STATE.results.forEach(r => {
    counts.stops[String(r.stops)] = (counts.stops[String(r.stops)] || 0) + 1;
    counts.airlines[r.airline.code] = (counts.airlines[r.airline.code] || 0) + 1;
  });
  const minPrice = STATE.results.length ? Math.min(...STATE.results.map(r => r.price)) : 0;
  const maxPrice = STATE.results.length ? Math.max(...STATE.results.map(r => r.price)) : 1000;
  const cur = f.maxPrice == null ? maxPrice : f.maxPrice;

  return `
    <div class="filter-block">
      <h4>Stops</h4>

        ['0','Nonstop'],
        ['1','1 stop'],

          <span><input type="checkbox" data-filter="stops" value="${v}" ${f.stops.has(v)?'checked':''}> ${label}</span>

    <div class="filter-block">

      <input type="range" class="range-input" data-filter="maxPrice"
             min="${minPrice}" max="${maxPrice}" value="${cur}" step="10">

        <span>${fmtPrice(minPrice)}</span>
        <span id="priceCur">${fmtPrice(cur)}</span>
      </div>
    </div>

    <div class="filter-block">
      <h4>Departure</h4>
      ${[
        ['any','Any time'],
        ['morning','Morning (5–12)'],
        ['afternoon','Afternoon (12–17)'],
        ['evening','Evening (17–22)'],
        ['night','Night (22–5)'],
      ].map(([v,label]) => `
        <label class="filter-row">
          <span><input type="radio" name="depWin" data-filter="departWindow" value="${v}" ${f.departWindow===v?'checked':''}> ${label}</span>
        </label>
      `).join('')}
    </div>

    <div class="filter-block">
      <h4>Airlines</h4>
      ${Object.keys(counts.airlines).sort().map(code => {
        const al = AIRLINES.find(a => a.code === code);
        return `
        <label class="filter-row">
          <span><input type="checkbox" data-filter="airlines" value="${code}"
            ${f.airlines.size === 0 || f.airlines.has(code) ? 'checked':''}> ${al ? al.name : code}</span>
          <span class="count">${counts.airlines[code]}</span>
        </label>`;
      }).join('')}
    </div>
  `;
}

function resultCard(r) {
  const open = STATE.expandedId === r.id;
  const stopsLabel = r.stops === 0 ? 'Nonstop' : r.stops === 1 ? '1 stop' : `${r.stops} stops`;
  const stopsCls = r.stops === 0 ? 'nonstop' : `stops-${r.stops}`;
  const qDot = r.quality >= 75 ? '' : (r.quality >= 55 ? 'fair' : 'poor');
  const qLabel = r.quality >= 75 ? 'Excellent journey' : r.quality >= 55 ? 'Acceptable' : 'Long journey';

  // Quality breakdown values
  const directMins = Math.round(60 + haversine(AIRPORT_BY_IATA[STATE.query.from], AIRPORT_BY_IATA[STATE.query.to]) / 850 * 60);
  const overhead = r.durMins - directMins;
  const layoverMins = r.segments.length > 1
    ? r.segments.slice(0, -1).reduce((sum, seg, i) => sum + (r.segments[i+1].depMins - seg.arrMins), 0)
    : 0;
  const depHr = Math.floor(r.depMins / 60) % 24;
  const timeOfDay = depHr < 5 ? 'Late night' : depHr < 12 ? 'Morning' : depHr < 17 ? 'Afternoon' : depHr < 22 ? 'Evening' : 'Night';

  return `
    <article class="result ${open ? 'open' : ''}" data-id="${r.id}">
      <div class="result-row">
        <div class="leg-block">
          <div class="leg">
            <div class="airline">
              ${r.airline.code}
              <div class="airline-name">${r.airline.name}</div>
            </div>
            <div>
              <div class="times">
                ${fmtTime(r.depMins)}
                <span class="arrow">→</span>
                ${fmtTime(r.arrMins)}
                ${r.arrMins >= 24*60 ? '<span class="iata">+1</span>' : ''}
              </div>
              <div class="leg-meta">
                <span>${fmtDuration(r.durMins)}</span>
                <span class="stops ${stopsCls}">${stopsLabel}</span>
                <span>${STATE.query.from} → ${STATE.query.to}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="price-block">
          <div class="price">${fmtPrice(r.price)}</div>
          <div class="price-meta">${STATE.query.pax > 1 ? 'per traveler' : 'total'}</div>
        </div>
        <div class="result-actions">
          <span class="quality-badge"><span class="quality-dot ${qDot}"></span>${qLabel}</span>
          <button class="btn btn-ghost" data-action="toggle">${open ? 'Hide details' : 'View details'}</button>
        </div>
      </div>

      <div class="result-detail">
        <div class="segments">
          ${r.segments.map((s, i) => {
            const layoverHtml = i < r.segments.length - 1
              ? `<div class="layover">Layover at ${s.to} · ${fmtDuration(r.segments[i+1].depMins - s.arrMins)}</div>`
              : '';
            return `
              <div class="segment">
                <div class="seg-flight">
                  ${s.airline}
                  <span class="num">${s.flightNum}</span>
                </div>
                <div class="seg-route">
                  <strong>${fmtTime(s.depMins)} ${s.from}</strong>
                  <span class="small"> → </span>
                  <strong>${fmtTime(s.arrMins)} ${s.to}</strong>
                </div>
                <div class="seg-dur">${fmtDuration(s.durMins)}</div>
              </div>
              ${layoverHtml}
            `;
          }).join('')}
        </div>

        <div class="quality-breakdown">
          <div class="qb-item">
            <div class="qb-label">Stops</div>
            <div class="qb-value">${r.stops}</div>
          </div>
          <div class="qb-item">
            <div class="qb-label">Overhead vs direct</div>
            <div class="qb-value">${overhead > 0 ? '+' + fmtDuration(overhead) : 'None'}</div>
          </div>
          <div class="qb-item">
            <div class="qb-label">Layover total</div>
            <div class="qb-value">${layoverMins > 0 ? fmtDuration(layoverMins) : '—'}</div>
          </div>
          <div class="qb-item">
            <div class="qb-label">Departs</div>
            <div class="qb-value">${timeOfDay}</div>
          </div>
        </div>

        <div class="detail-actions">
          <button class="btn btn-ghost" data-action="save">Save to Trips</button>
          <a class="btn" href="${bookingUrl(STATE.query)}" target="_blank" rel="noopener noreferrer">Book on Google Flights</a>
        </div>
      </div>
    </article>
  `;
}

function viewTrips() {
  const trips = loadTrips();
  return `
    <section class="trips wrap">
      <h1>Saved trips</h1>
      ${trips.length === 0
        ? `<div class="empty">
             <div class="em-title">No trips saved yet</div>
             <div class="em-sub">Search for a flight and save options you like.</div>
             <p style="margin-top:18px;"><a href="#/" class="btn">Start searching</a></p>
           </div>`
        : trips.map(t => {
            const fromA = AIRPORT_BY_IATA[t.query.from];
            const toA = AIRPORT_BY_IATA[t.query.to];
            return `
            <div class="trip-card">
              <div>
                <div class="route">${fromA ? fromA.city : t.query.from} → ${toA ? toA.city : t.query.to}</div>
                <div class="meta">
                  ${t.snapshot.airlineName} · ${fmtPrice(t.snapshot.price)} ·
                  ${fmtDuration(t.snapshot.durMins)} ·
                  ${t.snapshot.stops === 0 ? 'Nonstop' : t.snapshot.stops + ' stop' + (t.snapshot.stops > 1 ? 's' : '')} ·
                  ${fmtDate(t.query.depart)}${t.query.tripType === 'round' && t.query.ret ? ' – ' + fmtDate(t.query.ret) : ''}
                </div>
              </div>
              <div class="actions">
                <button class="btn btn-ghost" data-trip-id="${t.id}" data-action="search-again">Search again</button>
                <button class="btn btn-ghost" data-trip-id="${t.id}" data-action="delete-trip">Remove</button>
              </div>
            </div>`;
          }).join('')}
    </section>
  `;
}

/* ---------- Render ---------- */
function render() {
  const { path } = parseHash();
  const root = $('#root');

  // active nav
  $$('.nav-links a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active',
      (r === 'home' && (path === '/' || path === '/results')) ||
      (r === 'trips' && path === '/trips')
    );
  });

  if (path === '/results' && STATE.query && STATE.results.length) {
    root.innerHTML = viewResults();
  } else if (path === '/trips') {
    root.innerHTML = viewTrips();
  } else {
    root.innerHTML = viewHome();
    initSearchCard();
  }
}

/* ---------- Search card behavior (autocomplete + submit) ---------- */
function initSearchCard() {
  const card = $('#searchCard');
  if (!card) return;

  // Trip type toggle
  card.querySelectorAll('[data-trip]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.trip;
      const q = (STATE.query ||= {
        from: '', to: '',
        depart: todayISO(14), ret: todayISO(21),
        pax: 1, cabin: 'Economy', tripType: 'round',
      });
      q.tripType = val;
      // Re-render homepage to update grid
      render();
    });
  });

  // Autocomplete on from / to
  ['from','to'].forEach(name => {
    const wrap = card.querySelector(`[data-ac="${name}"]`);
    const input = wrap.querySelector('input');
    let acBox = null;
    let active = -1;
    const close = () => { if (acBox) { acBox.remove(); acBox = null; active = -1; } };
    const open = (q) => {
      close();
      const term = q.trim().toLowerCase();
      if (!term) return;
      const matches = AIRPORTS.filter(a =>
        a.iata.toLowerCase().startsWith(term) ||
        a.city.toLowerCase().includes(term) ||
        a.country.toLowerCase().includes(term)
      ).slice(0, 8);
      if (!matches.length) return;
      acBox = document.createElement('div');
      acBox.className = 'ac';
      acBox.innerHTML = matches.map((a,i) => `
        <div class="ac-item" data-iata="${a.iata}" data-idx="${i}">
          <span class="ac-iata">${a.iata}</span>
          <span class="ac-city">${a.city}</span>
          <span class="ac-country">${a.country}</span>
        </div>
      `).join('');
      wrap.appendChild(acBox);
      acBox.addEventListener('mousedown', e => {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        const iata = item.dataset.iata;
        input.value = airportLabel(iata);
        input.dataset.iata = iata;
        close();
      });
    };
    input.addEventListener('input', () => {
      delete input.dataset.iata;
      open(input.value);
    });
    input.addEventListener('focus', () => open(input.value));
    input.addEventListener('blur', () => setTimeout(close, 120));
    input.addEventListener('keydown', e => {
      if (!acBox) return;
      const items = acBox.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active+1, items.length-1); items.forEach((el,i)=>el.classList.toggle('active', i===active)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active-1, 0); items.forEach((el,i)=>el.classList.toggle('active', i===active)); }
      else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); items[active].dispatchEvent(new MouseEvent('mousedown', { bubbles: true })); }
    });
  });

  // Sync return min when depart changes
  const depart = card.querySelector('input[name="depart"]');
  const ret = card.querySelector('input[name="ret"]');
  if (depart && ret) {
    depart.addEventListener('change', () => {
      ret.min = depart.value;
      if (ret.value < depart.value) ret.value = depart.value;
    });
  }

  // Submit
  card.querySelector('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fromInput = card.querySelector('#fld-from');
    const toInput   = card.querySelector('#fld-to');
    let from = fromInput.dataset.iata || resolveIata(fromInput.value);
    let to   = toInput.dataset.iata   || resolveIata(toInput.value);
    if (!from || !AIRPORT_BY_IATA[from]) { toast('Pick an origin airport'); fromInput.focus(); return; }
    if (!to   || !AIRPORT_BY_IATA[to])   { toast('Pick a destination airport'); toInput.focus(); return; }
    if (from === to) { toast('Origin and destination must differ'); return; }

    const tripType = card.querySelector('[data-trip].active').dataset.trip;
    const query = {
      from, to,
      depart: fd.get('depart'),
      ret: tripType === 'round' ? fd.get('ret') : null,
      pax: parseInt(fd.get('pax'), 10) || 1,
      cabin: fd.get('cabin'),
      tripType,
    };
    runSearch(query);
  });
}

function resolveIata(text) {
  if (!text) return null;
  const t = text.trim().toUpperCase();
  if (AIRPORT_BY_IATA[t]) return t;
  const m = text.match(/\(([A-Z]{3})\)/);
  if (m && AIRPORT_BY_IATA[m[1]]) return m[1];
  // fuzzy
  const lower = text.trim().toLowerCase();
  const found = AIRPORTS.find(a => a.city.toLowerCase() === lower || a.iata.toLowerCase() === lower);
  return found ? found.iata : null;
}

function runSearch(query) {
  STATE.query = query;
  STATE.results = generateResults(query);
  STATE.filters = {
    stops: new Set(['0','1','2']),
    airlines: new Set(),
    maxPrice: null,
    departWindow: 'any',
  };
  STATE.expandedId = null;
  STATE.sort = 'best';
  navigate('/results', {
    from: query.from, to: query.to, depart: query.depart,
    ret: query.ret || '', pax: query.pax, cabin: query.cabin, tripType: query.tripType,
  });
}

/* ---------- Global event delegation (results & trips) ---------- */
document.addEventListener('click', e => {
  // Sort tabs
  const sortBtn = e.target.closest('.sort-tabs [data-sort]');
  if (sortBtn) {
    STATE.sort = sortBtn.dataset.sort;
    render();
    return;
  }

  // Edit search
  if (e.target.closest('#editSearch')) {
    navigate('/');
    return;
  }

  // Result card actions
  const card = e.target.closest('.result');
  if (card) {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action === 'toggle') {
      STATE.expandedId = STATE.expandedId === card.dataset.id ? null : card.dataset.id;
      render();
      return;
    }
    if (action === 'save') {
      const r = STATE.results.find(x => x.id === card.dataset.id);
      if (r) saveResultAsTrip(r);
      return;
    }
  }

  // Trip card actions
  const tripBtn = e.target.closest('[data-trip-id]');
  if (tripBtn) {
    const id = tripBtn.dataset.tripId;
    const action = tripBtn.dataset.action;
    if (action === 'delete-trip') {
      deleteTrip(id);
      toast('Trip removed');
      return;
    }
    if (action === 'search-again') {
      const trip = loadTrips().find(t => t.id === id);
      if (trip) runSearch(trip.query);
      return;
    }
  }
});

/* ---------- Filter rail interactions ---------- */
document.addEventListener('change', e => {
  const t = e.target.closest('[data-filter]');
  if (!t) return;
  const f = STATE.filters;
  const kind = t.dataset.filter;

  if (kind === 'stops') {
    if (t.checked) f.stops.add(t.value);
    else f.stops.delete(t.value);
    render();
  } else if (kind === 'airlines') {
    // when first airline toggled, switch from "all" mode (empty set)
    if (f.airlines.size === 0) {
      // initialize with all currently-shown airlines
      STATE.results.forEach(r => f.airlines.add(r.airline.code));
    }
    if (t.checked) f.airlines.add(t.value);
    else f.airlines.delete(t.value);
    render();
  } else if (kind === 'maxPrice') {
    f.maxPrice = parseInt(t.value, 10);
    const cur = $('#priceCur');
    if (cur) cur.textContent = fmtPrice(f.maxPrice);
  } else if (kind === 'departWindow') {
    f.departWindow = t.value;
    render();
  }
});
// price slider commit on release
document.addEventListener('input', e => {
  const t = e.target.closest('[data-filter="maxPrice"]');
  if (!t) return;
  const cur = $('#priceCur');
  if (cur) cur.textContent = fmtPrice(parseInt(t.value, 10));
});
document.addEventListener('mouseup', e => {
  if (e.target.closest('[data-filter="maxPrice"]')) render();
});
document.addEventListener('touchend', e => {
  if (e.target.closest('[data-filter="maxPrice"]')) render();
});

/* ---------- Init ---------- */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => {
  // Restore search from URL params if any
  const { path, params } = parseHash();
  if (path === '/results' && params.get('from') && params.get('to')) {
    const query = {
      from: params.get('from'),
      to: params.get('to'),
      depart: params.get('depart') || todayISO(14),
      ret: params.get('ret') || null,
      pax: parseInt(params.get('pax'), 10) || 1,
      cabin: params.get('cabin') || 'Economy',
      tripType: params.get('tripType') || 'round',
    };
    runSearch(query);
  } else {
    render();
  }
});

// expose for debugging
window.ATLAS = { STATE, render, runSearch, AIRPORTS, AIRLINES };

})();
</script>
</body>
</html>

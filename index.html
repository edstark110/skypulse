<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATLAS — Where would you like to go?</title>
<meta name="description" content="Smarter flight decisions. A calm, cinematic interface for finding and comparing flights worldwide." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>
<style>
  /* =====================================================================
     ATLAS · cinematic flight intelligence
     Idle → search → unfold. Globe is the heartbeat. Motion is the story.
     ===================================================================== */

  :root {
    --bg:           #06080F;
    --bg-1:         #0A0D17;
    --bg-2:         #11151F;
    --surface:      #161A26;
    --surface-2:    #1D2231;
    --ink:          #EFEAE0;
    --ink-2:        #A8A395;
    --ink-3:        #6E6A60;
    --ink-4:        #4A463E;
    --accent:       #C9A66B;
    --accent-2:     #E2C089;
    --accent-soft:  rgba(201, 166, 107, 0.10);
    --line:         rgba(239, 234, 224, 0.06);
    --line-2:       rgba(239, 234, 224, 0.14);
    --good:         #8DC5A0;
    --warn:         #E0B07B;
    --bad:          #D88884;

    --serif:        'Fraunces', Georgia, serif;
    --sans:         'Inter', system-ui, -apple-system, sans-serif;
    --mono:         'JetBrains Mono', ui-monospace, monospace;

    --ease-out-expo:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-quart:   cubic-bezier(0.25, 1, 0.5, 1);
    --ease-in-out-cubic:cubic-bezier(0.65, 0, 0.35, 1);

    --t-fast:       240ms;
    --t-med:        520ms;
    --t-slow:       880ms;
    --t-cine:       1200ms;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  body { min-height: 100vh; }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: inherit; }

  /* Subtle atmospheric noise overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.025;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ===== Editorial banner (rotating field notes) ===== */
  .field-banner {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 60;
    padding: 11px 32px;
    background: rgba(6, 8, 15, 0.78);
    backdrop-filter: saturate(140%) blur(18px);
    -webkit-backdrop-filter: saturate(140%) blur(18px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    font-size: 12px;
    color: var(--ink-2);
    overflow: hidden;
  }
  .field-banner .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    padding: 3px 9px;
    border: 1px solid rgba(201, 166, 107, 0.32);
    border-radius: 999px;
    flex-shrink: 0;
  }
  .field-banner .text {
    font-family: var(--serif);
    font-size: 14px;
    font-style: italic;
    color: var(--ink);
    letter-spacing: 0.005em;
    transition: opacity 600ms var(--ease-out-expo), transform 600ms var(--ease-out-expo);
    text-align: center;
  }
  .field-banner .text.fading {
    opacity: 0;
    transform: translateY(-4px);
  }

  /* ===== Site header ===== */
  header.site {
    position: fixed; top: 44px; left: 0; right: 0;
    z-index: 50;
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  header.site > * { pointer-events: auto; }
  .brand {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.32em;
    color: var(--ink);
    text-transform: uppercase;
    display: inline-flex; align-items: center;
  }
  .brand::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 14px;
    box-shadow: 0 0 18px rgba(201, 166, 107, 0.6);
    animation: pulseDot 4s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .nav-links {
    display: flex; gap: 28px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .nav-links a {
    transition: color var(--t-fast) var(--ease-out-expo);
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--accent); }

  /* ===== App container · view state machine ===== */
  main#root {
    position: relative;
    min-height: 100vh;
  }

  /* IDLE view: hero centered with globe behind */
  .stage-idle {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 120px 24px 80px;
    transition: opacity var(--t-cine) var(--ease-out-expo),
                transform var(--t-cine) var(--ease-out-expo);
  }
  body[data-view="results"] .stage-idle {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-30px);
    position: absolute;
    inset: 0;
  }
  body[data-view="trips"] .stage-idle { display: none; }

  /* ===== Globe atmosphere ===== */
  .globe-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .globe-stage svg.globe {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 880px;
    height: 880px;
    max-width: 130vmin;
    max-height: 130vmin;
    transition: transform var(--t-cine) var(--ease-out-expo),
                width var(--t-cine) var(--ease-out-expo),
                opacity var(--t-cine) var(--ease-out-expo);
    will-change: transform;
  }
  .globe-stage::before {
    /* atmospheric halo */
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 1100px; height: 1100px;
    max-width: 160vmin; max-height: 160vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%,
      rgba(201, 166, 107, 0.08) 0%,
      rgba(201, 166, 107, 0.02) 35%,
      transparent 70%);
    transform: translate(-50%, -50%);
    transition: opacity var(--t-cine) var(--ease-out-expo);
    z-index: -1;
  }
  .globe-stage::after {
    /* deep space gradient */
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(40, 30, 80, 0.10), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(80, 60, 20, 0.06), transparent 50%);
    z-index: -2;
  }

  /* Aircraft orbit — animateMotion handled inline */
  .aircraft-group {
    transform-box: fill-box;
    transform-origin: center;
  }
  .aircraft-glow {
    filter: drop-shadow(0 0 6px rgba(201, 166, 107, 0.6));
  }

  /* ===== Hero text + search ===== */
  .hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 720px;
    text-align: center;
  }
  .hero-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 28px;
    opacity: 0;
    animation: revealUp 1000ms var(--ease-out-expo) 200ms forwards;
  }
  .hero-title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(40px, 6vw, 76px);
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 14px;
    opacity: 0;
    animation: revealUp 1100ms var(--ease-out-expo) 360ms forwards;
  }
  .hero-title em {
    font-style: italic;
    color: var(--accent-2);
    font-weight: 300;
  }
  .hero-sub {
    font-family: var(--serif);
    font-style: italic;
    font-size: 17px;
    color: var(--ink-2);
    margin-bottom: 56px;
    opacity: 0;
    animation: revealUp 1100ms var(--ease-out-expo) 520ms forwards;
  }
  .hero-tagline {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-3);
    opacity: 0;
    animation: revealUp 1100ms var(--ease-out-expo) 1100ms forwards;
  }
  @keyframes revealUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Search card (idle / centered) ===== */
  .search {
    background: rgba(22, 26, 38, 0.55);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    padding: 22px 22px 22px;
    backdrop-filter: saturate(140%) blur(20px);
    -webkit-backdrop-filter: saturate(140%) blur(20px);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(239, 234, 224, 0.04) inset,
      0 1px 0 rgba(255, 255, 255, 0.06) inset;
    opacity: 0;
    animation: revealUp 1200ms var(--ease-out-expo) 720ms forwards;
  }
  .search-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.04fr 1.2fr 1fr 1fr;
    gap: 8px;
    align-items: stretch;
  }
  .search-grid.one-way { grid-template-columns: 1.2fr 0.04fr 1.2fr 1fr; }
  .field {
    position: relative;
    background: rgba(13, 16, 25, 0.6);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    transition: border-color var(--t-fast) var(--ease-out-expo),
                background var(--t-fast) var(--ease-out-expo);
    text-align: left;
  }
  .field:focus-within {
    border-color: var(--accent);
    background: rgba(13, 16, 25, 0.85);
  }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 2px;
  }
  .field input,
  .field select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: var(--ink);
    padding: 2px 0;
    font-weight: 400;
  }
  .field input::placeholder { color: var(--ink-4); }
  .field select { appearance: none; cursor: pointer; }

  .swap {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3);
    font-size: 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(13, 16, 25, 0.4);
    transition: all var(--t-fast) var(--ease-out-expo);
    cursor: pointer;
  }
  .swap:hover { color: var(--accent); border-color: var(--line-2); transform: rotate(180deg); }

  .search-actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px;
    gap: 12px;
  }
  .trip-type {
    display: flex; gap: 2px;
    background: rgba(13, 16, 25, 0.5);
    border: 1px solid var(--line);
    padding: 3px;
    border-radius: 999px;
  }
  .trip-type button {
    padding: 6px 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    border-radius: 999px;
    transition: all var(--t-fast) var(--ease-out-expo);
  }
  .trip-type button.active {
    background: var(--ink);
    color: var(--bg);
  }
  .btn-search {
    padding: 13px 28px;
    background: var(--accent);
    color: var(--bg);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all var(--t-fast) var(--ease-out-expo);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .btn-search:hover {
    background: var(--accent-2);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(201, 166, 107, 0.25);
  }
  .btn-search .arrow {
    transition: transform var(--t-fast) var(--ease-out-expo);
  }
  .btn-search:hover .arrow { transform: translateX(3px); }

  /* ===== Autocomplete ===== */
  .ac {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: rgba(22, 26, 38, 0.96);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(18px);
    z-index: 30;
    max-height: 320px;
    overflow-y: auto;
    opacity: 0;
    animation: revealUp 280ms var(--ease-out-expo) forwards;
  }
  .ac-item {
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
    transition: background var(--t-fast) var(--ease-out-expo);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: rgba(239, 234, 224, 0.04); }
  .ac-iata {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    min-width: 30px;
  }
  .ac-city { color: var(--ink); font-size: 13px; }
  .ac-country { color: var(--ink-3); font-size: 11px; margin-left: auto; }

  /* ===== RESULTS view (split: left rail + right map) ===== */
  .stage-results {
    position: fixed;
    inset: 96px 0 0 0;
    display: grid;
    grid-template-columns: 480px 1fr;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--t-cine) var(--ease-out-expo);
  }
  body[data-view="results"] .stage-results {
    opacity: 1;
    pointer-events: auto;
  }
  body[data-view="results"] .field-banner { transform: translateY(-100%); opacity: 0; }
  body[data-view="results"] header.site { padding-top: 14px; top: 0; }

  /* Results rail (left) */
  .rail {
    border-right: 1px solid var(--line);
    background: rgba(6, 8, 15, 0.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    overflow-y: auto;
    padding: 24px 24px 64px;
    transform: translateX(-30px);
    opacity: 0;
    transition: transform var(--t-slow) var(--ease-out-expo) 200ms,
                opacity var(--t-slow) var(--ease-out-expo) 200ms;
  }
  body[data-view="results"] .rail {
    transform: translateX(0);
    opacity: 1;
  }
  .rail-header {
    margin-bottom: 24px;
  }
  .rail-back {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: color var(--t-fast) var(--ease-out-expo);
  }
  .rail-back:hover { color: var(--ink); }
  .route-line {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.05;
    margin-bottom: 4px;
  }
  .route-line .iata {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    vertical-align: middle;
    margin: 0 4px;
  }
  .route-meta {
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 18px;
  }
  .sort-tabs {
    display: flex; gap: 2px;
    background: rgba(13, 16, 25, 0.5);
    border: 1px solid var(--line);
    padding: 3px;
    border-radius: 999px;
    margin-bottom: 20px;
    width: fit-content;
  }
  .sort-tabs button {
    padding: 6px 14px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    border-radius: 999px;
    transition: all var(--t-fast) var(--ease-out-expo);
  }
  .sort-tabs button.active {
    background: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }
  .result-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  /* Compact result cards */
  .result-card {
    background: rgba(22, 26, 38, 0.5);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color var(--t-fast) var(--ease-out-expo),
                background var(--t-fast) var(--ease-out-expo),
                transform var(--t-fast) var(--ease-out-expo);
    opacity: 0;
    transform: translateY(12px);
    animation: cardReveal 600ms var(--ease-out-expo) forwards;
  }
  @keyframes cardReveal {
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card:hover {
    border-color: var(--line-2);
    background: rgba(29, 34, 49, 0.6);
  }
  .result-card.selected {
    border-color: var(--accent);
    background: rgba(201, 166, 107, 0.06);
  }
  .result-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .airline-name {
    font-size: 13px;
    color: var(--ink-2);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .airline-name .code {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.05em;
    padding: 2px 6px;
    background: var(--accent-soft);
    border-radius: 4px;
  }
  .price {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .times-row {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 8px;
  }
  .times-row .time {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .times-row .arrow {
    color: var(--ink-3);
    font-size: 14px;
  }
  .times-row .dur {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    margin-left: auto;
  }
  .meta-row {
    display: flex; gap: 12px;
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 10px;
    align-items: center;
  }
  .meta-row .stops { color: var(--ink-2); }
  .meta-row .stops.nonstop { color: var(--good); }
  .meta-row .aircraft { font-family: var(--mono); letter-spacing: 0.04em; }
  .recommend {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    background: var(--accent-soft);
    border: 1px solid rgba(201, 166, 107, 0.22);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .recommend.recommend-best { color: var(--good); border-color: rgba(141, 197, 160, 0.28); background: rgba(141, 197, 160, 0.08); }
  .recommend.recommend-deal { color: var(--accent); }
  .pros-cons {
    display: flex; flex-direction: column; gap: 4px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .pc-item {
    font-size: 12px;
    color: var(--ink-2);
    display: flex; align-items: baseline; gap: 8px;
  }
  .pc-item .marker {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--ink-3);
    min-width: 14px;
  }
  .pc-item.con .marker { color: var(--warn); }
  .pc-item.pro .marker { color: var(--good); }

  /* Card detail expansion (segments + book) */
  .card-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .result-card.open .card-detail { display: block; }
  .segment {
    display: grid;
    grid-template-columns: 70px 1fr auto;
    gap: 12px;
    padding: 8px 0;
    align-items: center;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .segment:last-of-type { border-bottom: none; }

  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const lat1 = rad(a.lat), lat2 = rad(b.lat);
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));

  return h;
}
function fmtPrice(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function fmtDuration(m) { const h = Math.floor(m/60), mm = m%60; return `${h}h ${mm.toString().padStart(2,'0')}m`; }
function fmtTime(m) { const h = Math.floor(m/60)%24, mm = m%60; return `${h.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`; }
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function todayISO(off = 0) {
  const d = new Date(); d.setDate(d.getDate() + off);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- State ---------- */
const STATE = {
  view: 'idle',  // idle | results | trips
  query: null,
  results: [],
  sort: 'best',
  selectedId: null,
  expandedId: null,
};

/* ---------- Result generation (deterministic) ---------- */
function generateResults(query) {
  const from = AIRPORT_BY_IATA[query.from];
  const to   = AIRPORT_BY_IATA[query.to];
  if (!from || !to) return [];
  const distKm = haversine(from, to);
  if (distKm < 50) return [];

  const seed = hashStr(`${query.from}-${query.to}-${query.depart}-${query.cabin}`);
  const rand = rng(seed);
  const cabinMult = { Economy:1, 'Premium Economy':1.6, Business:3.6, First:6.5 }[query.cabin] || 1;
  const baseDirect = Math.round(60 + distKm / 850 * 60);

  const hubMatches = AIRLINES.filter(a => a.hub === from.iata || a.hub === to.iata);
  const candidates = [...hubMatches];
  for (const a of AIRLINES.filter(a => !hubMatches.includes(a))) {
    if (rand() < 0.55) candidates.push(a);
  }
  while (candidates.length < 6) candidates.push(AIRLINES[Math.floor(rand()*AIRLINES.length)]);

  const numResults = 6 + Math.floor(rand() * 3);
  const out = [];
  for (let i = 0; i < numResults && i < candidates.length; i++) {
    const airline = candidates[i];
    const aircraft = airline.fleet[Math.floor(rand() * airline.fleet.length)];

    let stops;
    const r = rand();
    if (distKm < 1500)      stops = 0;
    else if (distKm < 4000) stops = r < 0.55 ? 0 : 1;
    else if (distKm < 9000) stops = r < 0.30 ? 0 : (r < 0.85 ? 1 : 2);
    else                    stops = r < 0.18 ? 0 : (r < 0.78 ? 1 : 2);

    const stopOverhead = stops === 0 ? 0 :
      (stops === 1 ? 90 + Math.floor(rand()*240) : 240 + Math.floor(rand()*360));
    const total = baseDirect + stopOverhead + Math.floor(rand()*30);
    const dep = Math.floor(rand() * 24 * 60);

    let price = (distKm * 0.075 + 80) * airline.tier * cabinMult;
    price *= (1 + (rand() - 0.5) * 0.18);
    if (stops > 0) price *= (1 - 0.06 * stops);
    price = Math.max(60, price);

    // Segments
    const segments = [];
    if (stops === 0) {
      segments.push({
        airline: airline.code, flightNum: `${airline.code}${100 + Math.floor(rand()*900)}`,
        from: from.iata, to: to.iata, depMins: dep, arrMins: dep + total, durMins: total,
      });
    } else {
      const candidateHubs = AIRPORTS.filter(a => a.iata !== from.iata && a.iata !== to.iata);
      candidateHubs.sort((a,b) =>
        (haversine(from,a) + haversine(a,to)) -
        (haversine(from,b) + haversine(b,to)));
      const pool = candidateHubs.slice(0, 8 + stops);
      const hub1 = pool[Math.floor(rand() * pool.length)];
      const leg1 = Math.round(60 + haversine(from, hub1)/850 * 60);
      const layover1 = 60 + Math.floor(rand()*180);
      segments.push({
        airline: airline.code, flightNum: `${airline.code}${100+Math.floor(rand()*900)}`,
        from: from.iata, to: hub1.iata, depMins: dep, arrMins: dep+leg1, durMins: leg1,
      });
      if (stops === 1) {
        const leg2 = Math.round(60 + haversine(hub1, to)/850 * 60);
        segments.push({
          airline: airline.code, flightNum: `${airline.code}${100+Math.floor(rand()*900)}`,
          from: hub1.iata, to: to.iata,
          depMins: dep+leg1+layover1, arrMins: dep+leg1+layover1+leg2, durMins: leg2,
        });
      } else {
        const hub2 = pool[(pool.indexOf(hub1)+1 + Math.floor(rand()*(pool.length-1))) % pool.length] || pool[0];
        const leg2 = Math.round(45 + haversine(hub1, hub2)/850 * 60);
        const layover2 = 60 + Math.floor(rand()*180);
        const leg3 = Math.round(60 + haversine(hub2, to)/850 * 60);
        segments.push({
          airline: airline.code, flightNum: `${airline.code}${100+Math.floor(rand()*900)}`,
          from: hub1.iata, to: hub2.iata,
          depMins: dep+leg1+layover1, arrMins: dep+leg1+layover1+leg2, durMins: leg2,
        });
        segments.push({
          airline: airline.code, flightNum: `${airline.code}${100+Math.floor(rand()*900)}`,
          from: hub2.iata, to: to.iata,
          depMins: dep+leg1+layover1+leg2+layover2,
          arrMins: dep+leg1+layover1+leg2+layover2+leg3, durMins: leg3,
        });
      }
    }

    // Quality score
    const overhead = (total - baseDirect) / baseDirect;
    let q = 100 - stops*14 - Math.min(30, overhead*80);
    if (dep < 5*60 || dep > 23*60) q -= 6;
    q = Math.max(20, Math.round(q));

    out.push({
      id: `r${i}_${seed.toString(36)}`,
      airline, aircraft, stops,
      durMins: total, depMins: dep, arrMins: dep + total,
      price: Math.round(price), quality: q, segments,
    });
  }
  return out;
}

/* ---------- Pros / cons (real signals only) ---------- */
function buildProsAndCons(r, allResults) {
  const pros = [], cons = [];
  if (r.stops === 0) pros.push('Direct flight, no transfers.');
  const cheapest = Math.min(...allResults.map(x => x.price));
  const fastest  = Math.min(...allResults.map(x => x.durMins));
  if (r.price === cheapest) pros.push('Lowest fare on this route.');
  if (r.durMins === fastest) pros.push('Shortest total duration.');
  if (r.quality >= 80) pros.push('High journey-quality score.');
  if (r.stops >= 2) cons.push(`${r.stops} layovers extend total trip.`);
  if (r.depMins < 5*60) cons.push('Early-morning departure.');
  if (r.depMins > 23*60) cons.push('Late-night departure.');
  // Layover length
  const layoverMins = r.segments.length > 1
    ? r.segments.slice(0,-1).reduce((s, seg, i) => s + (r.segments[i+1].depMins - seg.arrMins), 0) : 0;
  if (layoverMins > 4*60) cons.push(`Long total layover (${fmtDuration(layoverMins)}).`);
  if (r.stops === 1 && layoverMins < 90) cons.push('Tight connection time.');
  return { pros: pros.slice(0,2), cons: cons.slice(0,2) };
}

/* ---------- Context panel signals (real) ---------- */
function ctxSignals(r, allResults, query) {
  if (!r) return null;
  const cheapest = Math.min(...allResults.map(x => x.price));
  const fastest  = Math.min(...allResults.map(x => x.durMins));
  const direct   = Math.round(60 + haversine(AIRPORT_BY_IATA[query.from], AIRPORT_BY_IATA[query.to])/850 * 60);
  const overheadMin = r.durMins - direct;
  if (r.price === cheapest && r.durMins === fastest) return 'Best on price and duration. Strong pick among the returned options.';
  if (r.price === cheapest) return `Lowest fare of ${allResults.length} options. Saves up to ${fmtPrice(Math.max(...allResults.map(x => x.price)) - r.price)} vs the most expensive.`;
  if (r.durMins === fastest) return `Fastest itinerary. ${overheadMin > 0 ? fmtDuration(overheadMin) + ' above the direct great-circle estimate.' : 'Right at the direct great-circle estimate.'}`;
  if (r.stops === 0) return 'Nonstop. No transfer risk, no layover wait.';
  if (r.quality >= 80) return 'High journey-quality score: balanced duration, stops, and timing.';
  if (r.depMins < 5*60) return 'Early departure trades sleep for a full day on arrival.';
  if (r.depMins > 21*60) return 'Late departure lets you finish a workday before flying.';
  return `${allResults.filter(x => x.price < r.price).length} cheaper options available. ${r.quality >= 60 ? 'But this carries a stronger journey-quality score.' : ''}`;
}

/* ---------- Booking link ---------- */
function bookingUrl(query) {
  const parts = [`Flights from ${query.from} to ${query.to}`, `on ${query.depart}`];
  if (query.tripType === 'round' && query.ret) parts.push(`returning ${query.ret}`);
  return 'https://www.google.com/travel/flights?q=' + encodeURIComponent(parts.join(' '));
}

/* ---------- Sorting ---------- */
function sortResults(list, mode) {
  const arr = [...list];
  if (mode === 'cheap')      arr.sort((a,b) => a.price - b.price);
  else if (mode === 'fast')  arr.sort((a,b) => a.durMins - b.durMins);
  else                       arr.sort((a,b) => {
    const sa = a.price*0.5 + a.durMins*0.3 - a.quality*4;
    const sb = b.price*0.5 + b.durMins*0.3 - b.quality*4;
    return sa - sb;
  });
  return arr;
}

/* ---------- Saved trips ---------- */
const TRIPS_KEY = 'atlas:trips';
function loadTrips() { try { return JSON.parse(localStorage.getItem(TRIPS_KEY) || '[]'); } catch { return []; } }
function saveTrips(arr) { localStorage.setItem(TRIPS_KEY, JSON.stringify(arr)); }
function saveResultAsTrip(r) {
  const trips = loadTrips();
  const id = `${STATE.query.from}-${STATE.query.to}-${STATE.query.depart}-${r.id}`;
  if (trips.some(t => t.id === id)) { toast('Already saved'); return; }
  trips.unshift({
    id, savedAt: Date.now(), query: { ...STATE.query },
    snapshot: {
      airlineCode: r.airline.code, airlineName: r.airline.name,
      aircraft: r.aircraft, price: r.price, durMins: r.durMins, stops: r.stops,
      depMins: r.depMins, arrMins: r.arrMins,
    },
  });
  saveTrips(trips.slice(0, 50));
  toast('Saved to Trips');
}
function deleteTrip(id) { saveTrips(loadTrips().filter(t => t.id !== id)); renderTripsList(); }

/* ---------- Routing ---------- */
function parseHash() {
  const raw = location.hash || '#/';
  const [path, qs] = raw.replace(/^#/, '').split('?');
  return { path, params: new URLSearchParams(qs || '') };
}
function navigate(path, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  location.hash = path + qs;
}

/* ---------- Globe: airport projection + route corridor ----------
   Project lat/lng to globe SVG coords (-180..180 in viewBox).
   Use a simplified orthographic centred on (lonCenter, 0).
   ============================================================ */
const GLOBE_R = 175;
const GLOBE_LON_CENTER = 20; // visual centre — tilts continents nicely

function projectToGlobe(lat, lng) {
  const lambda = (lng - GLOBE_LON_CENTER) * Math.PI / 180;
  const phi    = lat * Math.PI / 180;
  // Orthographic projection (great circle)
  const x = GLOBE_R * Math.cos(phi) * Math.sin(lambda);
  const y = -GLOBE_R * Math.sin(phi);
  const visible = Math.cos(phi) * Math.cos(lambda) >= 0;
  return { x, y, visible };
}

function renderRouteOverlay(query) {
  const overlay = document.getElementById('route-overlay');
  if (!overlay) return;
  if (!query || !AIRPORT_BY_IATA[query.from] || !AIRPORT_BY_IATA[query.to]) {
    overlay.setAttribute('opacity', '0');
    overlay.innerHTML = '';
    return;
  }
  const a = AIRPORT_BY_IATA[query.from];
  const b = AIRPORT_BY_IATA[query.to];
  const pa = projectToGlobe(a.lat, a.lng);
  const pb = projectToGlobe(b.lat, b.lng);

  // Arc — quadratic bezier with control point pulled outward
  const mx = (pa.x + pb.x)/2, my = (pa.y + pb.y)/2;
  const lenC = Math.hypot(mx, my) || 1;
  const lift = 60; // arc lift
  const cx = mx + (mx/lenC) * lift;
  const cy = my + (my/lenC) * lift;

  overlay.innerHTML = `
    <path id="corridor-path" class="corridor"
      d="M ${pa.x.toFixed(1)} ${pa.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${pb.x.toFixed(1)} ${pb.y.toFixed(1)}"
      fill="none"
      stroke="rgba(201,166,107,0.8)"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-dasharray="2,3"
      filter="drop-shadow(0 0 4px rgba(201,166,107,0.5))"/>
    <!-- Origin -->
    <g class="node" transform="translate(${pa.x.toFixed(1)},${pa.y.toFixed(1)})">
      <circle r="8" fill="rgba(201,166,107,0.12)"/>
      <circle r="3" fill="rgba(201,166,107,0.95)"/>
    </g>
    <!-- Destination -->
    <g class="node" transform="translate(${pb.x.toFixed(1)},${pb.y.toFixed(1)})" style="animation-delay:1s">
      <circle r="8" fill="rgba(201,166,107,0.12)"/>
      <circle r="3" fill="rgba(201,166,107,0.95)"/>
    </g>
    <!-- Labels -->
    <text x="${pa.x.toFixed(1)}" y="${(pa.y - 14).toFixed(1)}"
      font-family="JetBrains Mono, monospace" font-size="9" fill="rgba(239,234,224,0.7)"
      text-anchor="middle" letter-spacing="1">${a.iata}</text>
    <text x="${pb.x.toFixed(1)}" y="${(pb.y - 14).toFixed(1)}"
      font-family="JetBrains Mono, monospace" font-size="9" fill="rgba(239,234,224,0.7)"
      text-anchor="middle" letter-spacing="1">${b.iata}</text>
  `;
  overlay.setAttribute('opacity', '1');

  // Reattach aircraft to the new corridor path
  const aircraftGroup = document.querySelector('.aircraft-group');
  if (aircraftGroup) {
    const motion = aircraftGroup.querySelector('animateMotion');
    if (motion) {
      const mpath = motion.querySelector('mpath');
      if (mpath) {
        mpath.setAttribute('href', '#corridor-path');
        // restart animation
        motion.setAttribute('dur', '10s');
        motion.beginElement && motion.beginElement();
      }
    }
  }
}

function restoreOrbitAircraft() {
  const motion = document.querySelector('.aircraft-group animateMotion');
  if (!motion) return;
  const mpath = motion.querySelector('mpath');
  if (mpath) mpath.setAttribute('href', '#orbit-path');
  motion.setAttribute('dur', '44s');
  motion.beginElement && motion.beginElement();
}

function renderTripsList() {
  const trips = loadTrips();
  const host = $('#trips-list');

      <div class="empty">
        <div class="empty-title">No trips saved yet.</div>

        <a href="#/" class="btn-search">Start searching <span class="arrow">→</span></a>

  }
  host.innerHTML = trips.map((t, i) => {
    const fromA = AIRPORT_BY_IATA[t.query.from], toA = AIRPORT_BY_IATA[t.query.to];
    return `
      <div class="trip-card" style="animation-delay:${i*70}ms">
        <div>
          <div class="route">
            ${fromA ? fromA.city : t.query.from} → ${toA ? toA.city : t.query.to}
          </div>
          <div class="meta">
            ${t.snapshot.airlineName} · ${t.snapshot.aircraft || ''} · ${fmtPrice(t.snapshot.price)} ·
            ${fmtDuration(t.snapshot.durMins)} ·
            ${t.snapshot.stops === 0 ? 'Nonstop' : t.snapshot.stops + ' stop' + (t.snapshot.stops>1?'s':'')} ·
            ${fmtDate(t.query.depart)}${t.query.tripType==='round' && t.query.ret ? ' – ' + fmtDate(t.query.ret) : ''}
          </div>
        </div>
        <div class="actions">
          <button class="btn-soft" data-trip-id="${t.id}" data-action="search-again">Search again</button>
          <button class="btn-soft" data-trip-id="${t.id}" data-action="delete-trip">Remove</button>
        </div>
      </div>`;
  }).join('');
}

/* ---------- View transitions ---------- */
function setView(view) {
  STATE.view = view;
  document.body.setAttribute('data-view', view);
  // nav active state
  $$('.nav-links a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active',
      (r === 'home' && (view === 'idle' || view === 'results')) ||
      (r === 'trips' && view === 'trips')
    );
  });
}

function renderRoute() {
  const { path, params } = parseHash();
  if (path === '/trips') {
    setView('trips');
    renderTripsList();
    restoreOrbitAircraft();
    renderRouteOverlay(null);
  } else if (path === '/results' && STATE.query && STATE.results.length) {
    setView('results');
    renderRail();
    renderRouteOverlay(STATE.query);
    // auto-select top result for context panel
    if (!STATE.selectedId && STATE.results.length) {
      STATE.selectedId = sortResults(STATE.results, STATE.sort)[0].id;
    }
    const sel = STATE.results.find(r => r.id === STATE.selectedId);
    updateContextPanel(sel);
  } else {
    setView('idle');
    renderHome();
    restoreOrbitAircraft();
    renderRouteOverlay(null);
  }
}

/* ---------- Search card behavior ---------- */
function initSearchCard() {
  const card = $('#searchCard');
  if (!card) return;

  // Trip type
  card.querySelectorAll('[data-trip]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.query = STATE.query || defaultQuery();
      STATE.query.tripType = btn.dataset.trip;
      renderHome();
    });
  });

  // Swap
  $('#swapBtn')?.addEventListener('click', () => {
    const f = $('#fld-from'), t = $('#fld-to');
    [f.value, t.value] = [t.value, f.value];
    const fi = f.dataset.iata, ti = t.dataset.iata;
    if (ti) f.dataset.iata = ti; else delete f.dataset.iata;
    if (fi) t.dataset.iata = fi; else delete t.dataset.iata;
  });

  // Autocomplete
  ['from','to'].forEach(name => {
    const wrap = card.querySelector(`[data-ac="${name}"]`);
    const input = wrap.querySelector('input');
    let acBox = null, active = -1;
    const close = () => { if (acBox) { acBox.remove(); acBox = null; active = -1; } };
    const open = (q) => {
      close();
      const term = q.trim().toLowerCase();
      if (!term) return;
      const ranked = [];
      for (const a of AIRPORTS) {
        const ia = a.iata.toLowerCase(), ci = a.city.toLowerCase(),
              co = a.country.toLowerCase(), nm = (a.name||'').toLowerCase();
        let s = 0;
        if (ia === term)            s = 100;
        else if (ia.startsWith(term))    s = 90;
        else if (ci === term)            s = 80;
        else if (ci.startsWith(term))    s = 70;
        else if (nm.startsWith(term))    s = 60;
        else if (ci.includes(term))      s = 50;
        else if (nm.includes(term))      s = 40;
        else if (co.startsWith(term))    s = 30;
        else if (co.includes(term))      s = 20;
        else continue;
        ranked.push({ a, s });
      }
      ranked.sort((x,y) => y.s - x.s);
      const matches = ranked.slice(0, 8).map(r => r.a);
      if (!matches.length) return;
      acBox = document.createElement('div');
      acBox.className = 'ac';
      acBox.innerHTML = matches.map((a,i) => `
        <div class="ac-item" data-iata="${a.iata}" data-idx="${i}">
          <span class="ac-iata">${a.iata}</span>
          <span class="ac-city">${a.city}</span>
          <span class="ac-country">${a.country}</span>
        </div>`).join('');
      wrap.appendChild(acBox);
      acBox.addEventListener('mousedown', e => {
        const item = e.target.closest('.ac-item'); if (!item) return;
        e.preventDefault();
        const iata = item.dataset.iata;
        input.value = airportLabel(iata);
        input.dataset.iata = iata;
        close();
      });
    };
    input.addEventListener('input', () => { delete input.dataset.iata; open(input.value); });
    input.addEventListener('focus', () => open(input.value));
    input.addEventListener('blur', () => setTimeout(close, 140));
    input.addEventListener('keydown', e => {
      if (!acBox) return;
      const items = acBox.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active+1, items.length-1); items.forEach((el,i)=>el.classList.toggle('active', i===active)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active-1, 0); items.forEach((el,i)=>el.classList.toggle('active', i===active)); }
      else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); items[active].dispatchEvent(new MouseEvent('mousedown',{bubbles:true})); }
    });
  });

  // Date min sync
  const depart = card.querySelector('input[name="depart"]');
  const ret = card.querySelector('input[name="ret"]');
  if (depart && ret) {
    depart.addEventListener('change', () => {
      ret.min = depart.value;
      if (ret.value < depart.value) ret.value = depart.value;
    });
  }

  // Submit
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const fromInput = $('#fld-from'), toInput = $('#fld-to');
    let from = fromInput.dataset.iata || resolveIata(fromInput.value);
    let to   = toInput.dataset.iata   || resolveIata(toInput.value);
    if (!from || !AIRPORT_BY_IATA[from]) { toast('Pick an origin airport'); fromInput.focus(); return; }
    if (!to   || !AIRPORT_BY_IATA[to])   { toast('Pick a destination airport'); toInput.focus(); return; }
    if (from === to) { toast('Origin and destination must differ'); return; }

    const tripType = card.querySelector('[data-trip].active').dataset.trip;
    const query = {
      from, to,
      depart: fd.get('depart'),
      ret: tripType === 'round' ? fd.get('ret') : null,
      pax: parseInt(fd.get('pax'),10) || 1,
      cabin: fd.get('cabin'),
      tripType,
    };
    runSearch(query);
  });
}

function resolveIata(text) {
  if (!text) return null;
  const t = text.trim().toUpperCase();
  if (AIRPORT_BY_IATA[t]) return t;
  const m = text.match(/\(([A-Z]{3})\)/);
  if (m && AIRPORT_BY_IATA[m[1]]) return m[1];
  const lower = text.trim().toLowerCase();
  const found = AIRPORTS.find(a => a.city.toLowerCase() === lower || a.iata.toLowerCase() === lower);
  return found ? found.iata : null;
}

function runSearch(query) {
  STATE.query = query;
  STATE.results = generateResults(query);
  STATE.sort = 'best';
  STATE.selectedId = null;
  STATE.expandedId = null;
  navigate('/results', {
    from: query.from, to: query.to, depart: query.depart,
    ret: query.ret || '', pax: query.pax, cabin: query.cabin, tripType: query.tripType,
  });
}

/* ---------- Global click delegation ---------- */
document.addEventListener('click', e => {
  // Sort tabs
  const sortBtn = e.target.closest('.sort-tabs [data-sort]');
  if (sortBtn) {
    STATE.sort = sortBtn.dataset.sort;
    renderRail();
    return;
  }

  // Rail back
  if (e.target.closest('#railBack')) { navigate('/'); return; }

  // Result card actions
  const card = e.target.closest('.result-card');
  if (card) {
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action === 'save') {
      const r = STATE.results.find(x => x.id === card.dataset.id);
      if (r) saveResultAsTrip(r);
      return;
    }
    if (action === 'book') return; // let the link work
    // Clicking the card itself: select + toggle expand
    const wasOpen = STATE.expandedId === card.dataset.id;
    STATE.selectedId = card.dataset.id;
    STATE.expandedId = wasOpen ? null : card.dataset.id;
    renderRail();
    const sel = STATE.results.find(r => r.id === STATE.selectedId);
    updateContextPanel(sel);
    return;
  }

  // Trip card
  const tripBtn = e.target.closest('[data-trip-id]');
  if (tripBtn) {
    const id = tripBtn.dataset.tripId;
    const action = tripBtn.dataset.action;
    if (action === 'delete-trip') { deleteTrip(id); toast('Trip removed'); return; }
    if (action === 'search-again') {
      const trip = loadTrips().find(t => t.id === id);
      if (trip) runSearch(trip.query);
      return;
    }
  }
});

/* ---------- Subtle globe response while typing ---------- */
document.addEventListener('input', e => {
  if (!e.target.matches('#fld-from, #fld-to')) return;
  // Soft pulse the orbit aircraft glow as a tactile cue
  const ac = document.querySelector('.aircraft-group');
  if (ac) {
    ac.style.filter = 'drop-shadow(0 0 10px rgba(201,166,107,0.85))';
    clearTimeout(ac._t);
    ac._t = setTimeout(() => { ac.style.filter = ''; }, 600);
  }
});

/* ---------- Init ---------- */
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', () => {
  loadFullAirports();
  // Hydrate state from URL if entering on results
  const { path, params } = parseHash();
  if (path === '/results' && params.get('from') && params.get('to')) {
    runSearch({
      from: params.get('from'),
      to: params.get('to'),
      depart: params.get('depart') || todayISO(14),
      ret: params.get('ret') || null,
      pax: parseInt(params.get('pax'),10) || 1,
      cabin: params.get('cabin') || 'Economy',
      tripType: params.get('tripType') || 'round',
    });
  } else {
    renderRoute();
  }
});

window.ATLAS = { STATE, runSearch, get AIRPORTS(){return AIRPORTS;}, AIRLINES };

})();
</script>
